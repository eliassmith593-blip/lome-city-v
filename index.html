<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>LOME CITY V - FOULE + VOITURES</title><style>body{margin:0;overflow:hidden;background:#05070a;touch-action:none}canvas{display:block}#hud{position:fixed;top:0;left:0;right:0;padding:8px;display:flex;justify-content:space-between;color:#fff;font-family:Arial Black;font-size:8px;z-index:10;background:rgba(0,0,0,0.85)}#joy{position:fixed;bottom:20px;left:20px;width:110px;height:110px;background:rgba(255,255,255,0.12);border:2px solid #ffcc00;border-radius:50%;z-index:10}#stick{position:absolute;left:35px;top:35px;width:40px;height:40px;background:#ffcc00;border-radius:50%}#look{position:fixed;bottom:20px;right:20px;width:110px;height:110px;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2);border-radius:50%;z-index:10}#btns{position:fixed;bottom:140px;right:10px;z-index:10;display:flex;flex-direction:column;gap:6px}.ab{padding:10px 14px;background:#ffcc00;color:#000;border:none;border-radius:8px;font-weight:900;font-size:9px}#quest{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:4px 12px;border-radius:10px;font-family:Arial;font-size:8px;z-index:10}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body><div id="hud"><div>Three.js • Browser Game<br>LOMÉ • PHARMACIE 24/7</div><div style="text-align:right" id="fps">FPS: --<br><span style="color:#ffcc00">3500 LIEUX</span></div></div><div id="joy"><div id="stick"></div></div><div id="look"></div><div id="btns"><button class="ab" id="enter">E ENTRER VOITURE</button><button class="ab" id="run">🏃 COURIR</button></div><div id="quest">QUEST: Deliver Supplies • 0/3 • 0%</div><script type="module">
import * as THREE from 'three';
let scene=new THREE.Scene();scene.background=new THREE.Color(0x121a28);scene.fog=new THREE.FogExp2(0x121a28,0.012);
let camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,400);let renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x2a3a4a,0x0a0a0a,0.5));
for(let i=0;i<8;i++){let l=new THREE.PointLight(0xffaa44,1,35,2);l.position.set((Math.random()-0.5)*120,5,(Math.random()-0.5)*120);l.castShadow=true;scene.add(l);}
let road=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x111,roughness:0.2,metalness:0.6}));road.rotation.x=-Math.PI/2;road.receiveShadow=true;scene.add(road);
// batiments
function bld(x,z){let b=new THREE.Mesh(new THREE.BoxGeometry(12,14,10),new THREE.MeshStandardMaterial({color:0x2a2520}));b.position.set(x,7,z);b.castShadow=true;scene.add(b);}
// GENS (NPC)
let npcs=[];let colors=[0xffaa00,0x00aaff,0xff5555,0x55ff55,0xffcc66];for(let i=0;i<25;i++){let c=new THREE.Mesh(new THREE.CapsuleGeometry(0.25,0.8,2,6),new THREE.MeshStandardMaterial({color:colors[i%5]}));c.position.set((Math.random()-0.5)*60,0.8,(Math.random()-0.5)*60);c.userData={dx:(Math.random()-0.5)*0.04,dz:(Math.random()-0.5)*0.04};scene.add(c);npcs.push(c);}
// VOITURES
let cars=[];function car(x,z,col){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(2.2,1,4.2),new THREE.MeshStandardMaterial({color:col}));body.position.y=0.8;body.castShadow=true;g.add(body);let light1=new THREE.Mesh(new THREE.PlaneGeometry(0.3,0.2),new THREE.MeshStandardMaterial({color:0xffffaa,emissiveIntensity:2}));light1.position.set(-0.6,0.8,2.1);g.add(light1);let light2=light1.clone();light2.position.x=0.6;g.add(light2);g.position.set(x,0,z);scene.add(g);cars.push(g);}car(-5,0,0x4488ff);car(5,5,0xffcc00);car(0,-15,0x333333);
let player=new THREE.Mesh(new THREE.CapsuleGeometry(0.3,1,4,8),new THREE.MeshStandardMaterial({color:0x1a4a1a}));player.position.set(0,1,25);scene.add(player);
let rainGeo=new THREE.BufferGeometry();let rp=new Float32Array(4000*3);for(let i=0;i<rp.length;i++)rp[i]=(Math.random()-0.5)*200;rainGeo.setAttribute('position',new THREE.BufferAttribute(rp,3));let rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0x8899aa,size:0.12,transparent:true,opacity:0.35}));scene.add(rain);
let yaw=Math.PI,joyX=0,joyY=0,isRun=false,last=0,fpsCount=0;let joy=document.getElementById('joy'),stick=document.getElementById('stick'),look=document.getElementById('look');
function hJoy(e){let r=joy.getBoundingClientRect();let t=e.touches?e.touches[0]:e;let x=t.clientX-r.left-55,y=t.clientY-r.top-55;let d=Math.hypot(x,y);if(d>40){x=x/d*40;y=y/d*40;}stick.style.left=35+x+'px';stick.style.top=35+y+'px';joyX=x/40;joyY=y/40;}
function rJoy(){stick.style.left='35px';stick.style.top='35px';joyX=0;joyY=0;}
joy.addEventListener('touchstart',e=>{e.preventDefault();hJoy(e);});joy.addEventListener('touchmove',e=>{e.preventDefault();hJoy(e);});joy.addEventListener('touchend',rJoy);
let lastLX=0;look.addEventListener('touchstart',e=>{lastLX=e.touches[0].clientX;});look.addEventListener('touchmove',e=>{e.preventDefault();let t=e.touches[0];yaw-=(t.clientX-lastLX)*0.012;lastLX=t.clientX;});
document.getElementById('run').addEventListener('touchstart',()=>isRun=true);document.getElementById('run').addEventListener('touchend',()=>isRun=false);
let inCar=false;document.getElementById('enter').addEventListener('click',()=>{inCar=!inCar;document.getElementById('enter').textContent=inCar?'E SORTIR':'E ENTRER VOITURE';});
function loop(t){requestAnimationFrame(loop);let dt=(t-last)/1000;last=t;fpsCount++;if(t%1000<50)document.getElementById('fps').innerHTML='FPS: '+Math.round(fpsCount*2)+' <br><span style="color:#ffcc00">'+(inCar?'DANS VOITURE':'A PIED')+'</span>';if(t%2000<50)fpsCount=0;
let sp=isRun?0.18:0.09;if(inCar)sp=0.35;player.position.x-=Math.sin(yaw)*joyY*sp+Math.cos(yaw)*joyX*sp;player.position.z-=Math.cos(yaw)*joyY*sp-Math.sin(yaw)*joyX*sp;player.rotation.y=yaw;
npcs.forEach(n=>{n.position.x+=n.userData.dx;n.position.z+=n.userData.dz;if(Math.abs(n.position.x)>35)n.userData.dx*=-1;if(Math.abs(n.position.z)>35)n.userData.dz*=-1;});
cars.forEach((c,i)=>{c.position.z+=0.03+i*0.01;if(c.position.z>50)c.position.z=-50;});
let pos=rain.attributes.position.array;for(let i=1;i<pos.length;i+=3){pos[i]-=1.5;if(pos[i]<-2)pos[i]=60;}rain.attributes.position.needsUpdate=true;
if(inCar&&cars[0]){camera.position.set(cars[0].position.x,cars[0].position.y+2.5,cars[0].position.z+5);camera.lookAt(cars[0].position);}else{camera.position.set(player.position.x+Math.sin(yaw)*0.5,1.7,player.position.z+Math.cos(yaw)*0.5);camera.rotation.order='YXZ';camera.rotation.y=yaw;}
renderer.render(scene,camera);}loop(0);
</script></body></html>
