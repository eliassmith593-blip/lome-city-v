<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOME CITY V - ADULT REAL</title><style>body{margin:0;overflow:hidden;background:#05070a}canvas{display:block}#hud{position:fixed;top:0;left:0;right:0;padding:10px 15px;display:flex;justify-content:space-between;color:#fff;font-family:Arial Black;font-size:10px;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,0.9),transparent)}#bar{position:fixed;bottom:15px;left:15px;right:15px;height:4px;background:#222;z-index:10;border-radius:10px;overflow:hidden}#fill{height:100%;width:62%;background:#ffcc00}#help{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);color:#fff;font-family:Arial;font-size:9px;background:rgba(0,0,0,0.7);padding:4px 10px;border-radius:10px;z-index:10}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body><div id="hud"><div>LOMÉ, TOGO • 02:14 • RAINY<br><span style="opacity:0.6">MARCHÉ DE LOMÉ - TOKOIN</span></div><div style="text-align:right">HP: 100 • STAMINA: 78%<br><span style="color:#ffcc00">GPS: 3500 LIEUX • 5 RÉGIONS</span></div></div><div id="help">[WASD] Move • [SHIFT] Sprint • Souris pour regarder • Clique pour jouer</div><div id="bar"><div id="fill"></div></div><script type="module">
import * as THREE from 'three';
let scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0e14);scene.fog=new THREE.FogExp2(0x0a0e14,0.012);
let camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.1,500);
let renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.9;document.body.appendChild(renderer.domElement);
let hemi=new THREE.HemisphereLight(0x2a3a4a,0x0a0a0a,0.4);scene.add(hemi);
for(let i=0;i<10;i++){let l=new THREE.PointLight(0xffaa44,1.2,45,2);l.position.set((Math.random()-0.5)*120,6,(Math.random()-0.5)*120);l.castShadow=true;l.shadow.mapSize.set(512,512);scene.add(l);let pole=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,7),new THREE.MeshStandardMaterial({color:0x111}));pole.position.set(l.position.x,3.5,l.position.z);scene.add(pole);let head=new THREE.Mesh(new THREE.SphereGeometry(0.4,8,8),new THREE.MeshStandardMaterial({color:0xffcc66,emissive:0xffcc66,emissiveIntensity:2}));head.position.set(l.position.x,6.5,l.position.z);scene.add(head);}
let road=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x0e0e0e,roughness:0.15,metalness:0.75}));road.rotation.x=-Math.PI/2;road.receiveShadow=true;scene.add(road);
function building(x,z,w,h,winCount){let g=new THREE.Group();let b=new THREE.Mesh(new THREE.BoxGeometry(w,h,9),new THREE.MeshStandardMaterial({color:0x1e1a15,roughness:0.85}));b.position.y=h/2;b.castShadow=true;b.receiveShadow=true;g.add(b);
for(let i=0;i<winCount;i++){let on=Math.random()>0.4;let win=new THREE.Mesh(new THREE.PlaneGeometry(0.9,0.9),new THREE.MeshStandardMaterial({color:on?0xffcc66:0x0a0a0a,emissive:on?0xffcc66:0x000000,emissiveIntensity:on?1.5:0}));win.position.set((Math.random()-0.5)*w*0.75,1.5+Math.random()*(h-3),4.6);g.add(win);}
let shop=new THREE.Mesh(new THREE.PlaneGeometry(w*0.8,0.8),new THREE.MeshStandardMaterial({color:0x111}));shop.position.set(0,1.2,4.61);g.add(shop);
g.position.set(x,0,z);scene.add(g);}
building(-18,0,12,14,8);building(-18,22,13,18,12);building(-18,-22,11,16,7);building(18,8,15,20,14);building(18,-15,12,15,9);building(-35,10,10,12,5);building(35,-8,16,22,16);building(0,45,20,10,4);building(0,-45,20,12,6);
let player=new THREE.Mesh(new THREE.CapsuleGeometry(0.35,1.1,4,8),new THREE.MeshStandardMaterial({color:0x1a2f1a}));player.position.set(0,1,20);scene.add(player);
let rainGeo=new THREE.BufferGeometry();let rainPos=new Float32Array(7000*3);for(let i=0;i<rainPos.length;i++)rainPos[i]=(Math.random()-0.5)*300;rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));let rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0x8899aa,size:0.14,transparent:true,opacity:0.45}));scene.add(rain);
let yaw=Math.PI,keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
addEventListener('mousemove',e=>{if(document.pointerLockElement) yaw-=e.movementX*0.003;});
renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock());
function loop(){requestAnimationFrame(loop);let f=(keys['w']?1:0)-(keys['s']?1:0);let s=(keys['a']?1:0)-(keys['d']?1:0);let sp=keys['shift']?0.22:0.11;
player.position.x-=Math.sin(yaw)*f*sp+Math.cos(yaw)*s*sp*0.7;player.position.z-=Math.cos(yaw)*f*sp-Math.sin(yaw)*s*sp*0.7;player.rotation.y=yaw;
let pos=rain.attributes.position.array;for(let i=1;i<pos.length;i+=3){pos[i]-=1.8;if(pos[i]<-5)pos[i]=80;}rain.attributes.position.needsUpdate=true;
camera.position.set(player.position.x+Math.sin(yaw)*0.4,1.62,player.position.z+Math.cos(yaw)*0.4);camera.rotation.order='YXZ';camera.rotation.y=yaw;
renderer.render(scene,camera);}loop();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
